# ==========================================================================
# Miparner — despliegue continuo al droplet de DigitalOcean.
#
# Un push a main: construye las dos imágenes, las publica en GHCR y el droplet
# solo las descarga y arranca.
#
# Por qué se construye aquí y no en el servidor: el droplet tiene 512 MB de RAM
# y el build de Vite no cabe. Actions da 4 vCPU y 16 GB gratis.
#
# Secretos necesarios (Settings > Secrets and variables > Actions).
# Los imprime `deploy/bootstrap-droplet.sh` al terminar:
#   DEPLOY_HOST  DEPLOY_USER  DEPLOY_SSH_KEY
#   DATABASE_URL  JWT_ACCESS_SECRET  JWT_REFRESH_SECRET
#   MIPARNER_DOMINIO  CORS_ORIGINS      (los defines tú)
# ==========================================================================
name: Desplegar a DigitalOcean

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano sin tocar el código.
  workflow_dispatch:

env:
  REGISTRO: ghcr.io
  # GHCR exige minúsculas en el nombre de la imagen.
  IMAGEN_BACKEND: ghcr.io/riveracristian/miparner-backend
  IMAGEN_FRONTEND: ghcr.io/riveracristian/miparner-frontend

jobs:
  # ------------------------------------------------------------------------
  construir:
    name: Construir y publicar imágenes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - componente: backend
            contexto: ./backend
            imagen: ghcr.io/riveracristian/miparner-backend
          - componente: frontend
            contexto: ./frontend
            imagen: ghcr.io/riveracristian/miparner-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar ${{ matrix.componente }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          # Dos etiquetas: `latest` es la que arranca el servidor; la del commit
          # permite volver atrás con exactitud si un despliegue sale mal.
          tags: |
            ${{ matrix.imagen }}:latest
            ${{ matrix.imagen }}:${{ github.sha }}
          # Caché entre ejecuciones: sin esto cada despliegue reinstala todas
          # las dependencias desde cero.
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}

  # ------------------------------------------------------------------------
  desplegar:
    name: Desplegar en el droplet
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para que el droplet pueda descargar las imágenes aunque el paquete de
      # GHCR sea privado (lo es por omisión, incluso con el repo público).
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/miparner
          overwrite: true

      - name: Migrar la base y levantar la versión nueva
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          MIPARNER_DOMINIO: ${{ secrets.MIPARNER_DOMINIO }}
          MIPARNER_EMAIL_TLS: ${{ secrets.MIPARNER_EMAIL_TLS }}
          SEED_ADMIN_CORREO: ${{ secrets.SEED_ADMIN_CORREO }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GHCR_USUARIO: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Los secretos viajan como variables de entorno, no incrustados en el
          # texto del script: así no acaban en el registro de la ejecución.
          envs: DATABASE_URL,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,CORS_ORIGINS,MIPARNER_DOMINIO,MIPARNER_EMAIL_TLS,SEED_ADMIN_CORREO,SEED_ADMIN_PASSWORD,GHCR_USUARIO,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/miparner

            # Credenciales de descarga. El token es temporal: caduca al terminar
            # esta ejecución, así que no queda nada reutilizable en el servidor.
            echo "${GHCR_TOKEN:-}" | docker login ghcr.io -u "${GHCR_USUARIO:-}" --password-stdin

            # El .env vive solo en el servidor, nunca en el repositorio.
            umask 077
            # `${VAR:-}` y no `${VAR}`: el script corre con `set -u`, y un secreto
            # que todavía no existe llega sin definir. Sin el valor por defecto,
            # el despliegue entero aborta con "unbound variable" en vez de
            # arrancar con la configuración mínima.
            cat > .env <<EOF
            DATABASE_URL=${DATABASE_URL:-}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
            CORS_ORIGINS=${CORS_ORIGINS:-}
            MIPARNER_DOMINIO=${MIPARNER_DOMINIO:-}
            MIPARNER_EMAIL_TLS=${MIPARNER_EMAIL_TLS:-}
            JWT_ACCESS_TTL=15m
            JWT_REFRESH_TTL=30d
            UPLOAD_MAX_MB=8
            EOF

            docker compose -f docker-compose.prod.yml pull

            # Las migraciones corren DENTRO del droplet, contra el PostgreSQL
            # local. Hacerlo desde el CI obligaría a exponer la base a internet.
            # Va antes de levantar la versión nueva: si falla, el sitio sigue
            # con la versión anterior en pie.
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              npx prisma migrate deploy

            # Datos base: administrador, insignias y premios. Es idempotente
            # (hace upsert), así que correrlo en cada despliegue no duplica nada
            # y sirve para reponer el acceso del equipo si se pierde.
            # Sin esto la base queda sin ningún usuario y nadie puede entrar.
            #
            # Un fallo aquí NO detiene el despliegue: es mejor que la aplicación
            # suba y el trabajo termine en rojo, a que un problema con el seed
            # deje el sitio en la versión anterior sin avisar. El código de
            # salida se guarda y se aplica al final.
            SEED_OK=1
            if [ -n "${SEED_ADMIN_PASSWORD:-}" ]; then
              echo "::group::Sembrando datos base"

              # Diagnóstico: si el seed compilado no está en la imagen, decirlo
              # claramente en vez de fallar con un críptico "cannot find module".
              docker compose -f docker-compose.prod.yml run --rm --no-deps --entrypoint sh backend -c 'ls -la dist-seed 2>/dev/null || echo "AVISO: la imagen no contiene dist-seed/"' || true

              if docker compose -f docker-compose.prod.yml run --rm --no-deps -e SEED_ADMIN_CORREO="${SEED_ADMIN_CORREO:-}" -e SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}" backend node dist-seed/seed.js; then
                echo "Seed correcto: el administrador existe."
              else
                echo "EL SEED FALLÓ (el error está arriba). La aplicación se despliega igual,"
                echo "pero la base puede quedarse sin administrador."
                SEED_OK=0
              fi
              echo "::endgroup::"
            else
              echo "SEED_ADMIN_PASSWORD no está definido: se omite el seed."
              echo "Sin él la base no tendrá ningún administrador."
            fi

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Disco de 10 GB: las imágenes viejas lo llenan en pocas semanas.
            docker image prune -af --filter "until=168h"

            # El token ya no sirve para nada, pero no se deja escrito en disco.
            docker logout ghcr.io

            # Ya con la aplicación desplegada, el seed decide si el trabajo pasa.
            if [ "$SEED_OK" != "1" ]; then
              echo "Despliegue terminado, pero el seed falló: revisa el grupo de arriba."
              exit 1
            fi

      - name: Comprobar que responde
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            # El backend tarda unos segundos en aceptar conexiones.
            for i in $(seq 1 20); do
              if curl -fsS http://localhost/health >/dev/null 2>&1; then
                echo "Despliegue correcto: /health responde."
                exit 0
              fi
              sleep 3
            done
            echo "El servicio no respondió en 60 segundos. Registro del backend:"
            docker logs --tail 50 miparner-backend
            exit 1
